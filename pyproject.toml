[build-system]
requires = [ "setuptools>=84.0.0", "wheel" ]
build-backend = "setuptools.build_meta"

[project]
name = "la-stack-scripts"
version = "0.4.6"
description = "Python utility scripts for the la-stack Rust library"
readme = "scripts/README.md"
requires-python = ">=3.14"
license = "BSD-3-Clause"
authors = [
    { name = "Adam Getchell", email = "adam@adamgetchell.org" },
]
keywords = [ "linear-algebra", "benchmarking", "utilities", "la-stack" ]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: System :: Benchmarking",
]

# Benchmark adapters use only the installed shared package and the standard library.
dependencies = [ "research-repo-tools==0.1.8" ]

[project.urls]
"Homepage" = "https://github.com/acgetchell/la-stack"
"Documentation" = "https://docs.rs/la-stack"
"Repository" = "https://github.com/acgetchell/la-stack"
"Bug Tracker" = "https://github.com/acgetchell/la-stack/issues"

[project.scripts]
archive-performance = "archive_performance:main"
bench-compare = "bench_compare:main"
criterion-dim-plot = "criterion_dim_plot:main"

# Configure setuptools to find modules in scripts/ directory.
[tool.setuptools]
package-dir = { "" = "scripts" }
py-modules = [ "archive_performance", "bench_compare", "benchmark_contract", "benchmark_process", "benchmark_summaries", "criterion_dim_plot", "performance_artifacts", "performance_phase", "performance_runs", "release_baseline" ]

[tool.ruff]
line-length = 160
src = [ "scripts" ]

[tool.ruff.lint]
select = [ "E", "F", "W", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206", "C90", "I", "N", "UP", "YTT", "ASYNC", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "FA", "T10", "EM", "EXE", "FIX", "FLY", "FURB", "ISC", "ICN", "LOG", "G", "INP", "PERF", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "SLOT", "TC", "TID", "TD", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RUF", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107" ]
fixable = [ "ALL" ]
unfixable = [  ]
ignore = [
    # Formatter conflicts
    "COM812", # Trailing comma missing (conflicts with formatter)
    "ISC001", # Implicitly concatenated string literals (conflicts with formatter)

    # CLI script patterns
    "PLR2004", # Magic value used in comparison - OK for CLI constants and thresholds
    "FBT001", # Boolean-typed positional argument - OK for CLI flags
    "FBT002", # Boolean default positional argument - OK for CLI flags
    "T201", # print found - OK for CLI output
    "TRY300", # Consider moving statement to else block - OK for CLI control flow
    "TRY301", # Abstract raise to inner function - OK for straightforward CLI error handling
    "ARG001", # Unused function argument - common in callbacks
    "ERA001", # Found commented-out code - OK for explanatory comments
    "EXE001", # Shebang present but file not executable - handled by packaging
    "PTH123", # open() should be replaced by Path.open() - OK for some call sites
    "EM102", # Exception must not use f-string - OK for CLI error messages
    "TRY003", # Avoid specifying long messages outside exception class - OK for CLI reporting
    "N806", # Uppercase local names are acceptable for constants and ANSI color codes
    "F841", # Color constants may be assigned conditionally for CLI output
    "PLW2901", # Loop-variable replacement is acceptable for line-processing transforms
]

[tool.ruff.lint.per-file-ignores]
"**/tests/test_*.py" = [ "S101", "SLF001", "D101", "D102", "D103" ]
# Static-analysis fixtures intentionally contain the patterns these rules reject.
"tests/semgrep/scripts/python_portability.py" = [ "D103", "INP001", "N813", "PLW1510", "S603", "S607", "SIM115", "UP020" ]
"tests/semgrep/scripts/tests/python_exceptions.py" = [ "BLE001", "D100", "D103", "EM101", "INP001", "S110", "S607", "SIM105" ]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = [
    "archive_performance",
    "bench_compare",
    "benchmark_contract",
    "benchmark_process",
    "benchmark_summaries",
    "criterion_dim_plot",
    "performance_artifacts",
    "performance_phase",
    "performance_runs",
    "release_baseline",
]
force-single-line = false
split-on-trailing-comma = true
combine-as-imports = true
order-by-type = true
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = [ "-ra", "--strict-markers", "--strict-config", "--color=yes" ]
testpaths = [ "scripts/tests" ]
python_files = [ "test_*.py", "*_test.py" ]
python_classes = [ "Test*" ]
python_functions = [ "test_*" ]

[tool.rumdl]
line-length = 160
disable = [
    "MD018",
    "MD024",
    "MD029",
    "MD033",
    "MD037",
    "MD038",
    "MD041",
    "MD060",
]

[tool.rumdl.MD013]
line-length = 160

[tool.uv]
package = true
required-version = "==0.12.23"
# Semgrep wheels bundle the native engine; building its sdist does not.
no-build-package = [ "semgrep" ]
# Semgrep 1.178.0 restricts PyJWT to 2.13.x; 2.15.1 contains the OSV fixes.
# Keep crypto support while overriding that restriction until upstream updates it.
override-dependencies = [ "pyjwt[crypto]>=2.15.1,<3" ]

[dependency-groups]
tooling = [ "research-repo-tools==0.1.8" ]
dev = [
    { include-group = "tooling" },
    "actionlint-py==1.7.12.25",
    "pytest==9.1.1",
    "ruff==0.16.10",
    "semgrep==1.180.0",
    "shellcheck-py==0.11.0.1",
    "shfmt-py==4.2.0",
    "ty==0.0.85",
    "yamllint==1.38.0",
]

[tool.research-repo-tools]
schema = 1

[tool.research-repo-tools.toolchain.binaries]
gitleaks = "8.30.1"
osv-scanner = "2.6.0"

[tool.research-repo-tools.toolchain.cargo]
cargo-edit = "0.13.13"
cargo-llvm-cov = "0.9.1"
cargo-machete = "0.9.2"
cargo-nextest = "0.9.148"
clippy-sarif = "0.8.0"
dprint = "0.61.1"
git-cliff = "2.14.2"
rumdl = "0.2.78"
sarif-fmt = "0.8.0"
taplo-cli = "0.10.0"
typos-cli = "1.51.1"
zizmor = "1.30.1"

[tool.research-repo-tools.changelog]
owner = "acgetchell"
repository = "la-stack"
formatter = "changelog-rumdl.toml"
dependency-bodies = "preserve"

[tool.research-repo-tools.zizmor]
persona = "regular"

[tool.research-repo-tools.release]
# Release preparation and post-merge tagging can happen on different UTC days.
date-policy = "declared"
tag-policy = "canonical-stable"
required-files = [ "Cargo.lock", "pyproject.toml", "uv.lock", "CITATION.cff", "CHANGELOG.md", "README.md", "REFERENCES.md" ]
# Retained scientific reports and measured links do not advance with metadata.
exclude = [ "docs/archive/**", "docs/performance/**", "docs/performance.md" ]

[[tool.research-repo-tools.release.rules]]
path = "README.md"
pattern = 'https://(?:github\.com/acgetchell/la-stack/(?:blob|raw|tree)/|raw\.githubusercontent\.com/acgetchell/la-stack/)(?P<value>main|v[0-9]+\.[0-9]+\.[0-9]+|[0-9a-f]{7,40})/[^\s)\]>"?]+'
value = "main"
count = 31
exclude = '/docs/assets/bench/'

[[tool.research-repo-tools.release.rules]]
path = "CITATION.cff"
pattern = '''^doi:[ \t]*['"]?(?P<value>[^'"\s]+)['"]?[ \t]*(?:#.*)?\r?$'''
value = "10.5281/zenodo.18158926"

[[tool.research-repo-tools.release.rules]]
path = "README.md"
pattern = 'https://doi\.org/(?P<value>10\.5281/zenodo\.[0-9]+)'
count = 2
value = "10.5281/zenodo.18158926"

[[tool.research-repo-tools.release.rules]]
path = "REFERENCES.md"
pattern = 'https://doi\.org/(?P<value>10\.5281/zenodo\.[0-9]+)'
value = "10.5281/zenodo.18158926"

[tool.research-repo-tools.semgrep]
config = "semgrep.yaml"
fixtures = "tests/semgrep"
namespace = "la-stack."
cwd = "."
timeout = 120
