name: zizmor policy fixtures
on: push
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # ruleid: la-stack.github-actions.zizmor-tool-version-pinned
      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          version: "1.30.1"
      # ruleid: la-stack.github-actions.zizmor-managed-execution
      - run: zizmor --persona regular --format sarif .github
      # ruleid: la-stack.github-actions.zizmor-managed-execution
      - run: |
          set -euo pipefail
          zizmor --persona regular .github
      # ok: la-stack.github-actions.zizmor-managed-execution
      - run: |
          set -euo pipefail
          uv run --locked --no-sync research-repo-tools \
            toolchain run -- zizmor --persona regular --format sarif .github
