# Scientific measurement policy consumed directly by research-repo-tools.
schema = 2
minimum-release = "v0.5.0"
sources = [ "src/**/*.rs", "Cargo.toml" ]
harness = [
    "benches/**/*.rs",
    "benches/comparison/Cargo.toml",
    "examples/**/*.rs",
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain.toml",
    "tests/exact_bench_config.rs",
    "tooling/performance.just",
    "tooling/criterion-inventory.toml",
    "tooling/measurements/*.toml",
]
sample-count = 100
statistics = [ "mean", "median" ]
confidence-level = 0.95
unit = "ns"
timeout = 14400
compatible = [
    "harness_sha256",
    "context.os",
    "context.architecture",
    "context.cpu",
    "context.tool.rustc",
    "context.tool.cargo",
    "context.tool.just",
    "context.dependency.criterion",
    "context.dependency.nalgebra",
    "context.dependency.faer",
]

[context]
phase-driver = "just-v1"
suite = "vs_linalg"
scope = "release-signal"
baseline-api-compatibility = "none"

[probes]
rustc = [ "rustc", "-vV" ]
cargo = [ "cargo", "--version" ]
just = [ "just", "--version" ]

[dependencies]
criterion = "Cargo.lock"
nalgebra = "Cargo.lock"
faer = "Cargo.lock"

[phases.baseline]
command = [ "just", "--justfile", "tooling/performance.just", "--working-directory", ".", "baseline-vs_linalg" ]
gate = [ "just", "--justfile", "tooling/performance.just", "--working-directory", ".", "gate" ]
# Fixed code-generation settings are recorded for both phases.
environment = { CARGO_TARGET_DIR = "target", CRITERION_HOME = "target/criterion", RUSTUP_TOOLCHAIN = "1.99.1", RUSTFLAGS = "--cap-lints=warn", CARGO_ENCODED_RUSTFLAGS = "--cap-lints=warn", RUSTC = "rustc", RUSTC_WRAPPER = "", RUSTC_WORKSPACE_WRAPPER = "" }

