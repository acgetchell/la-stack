[[phases.current.discovery.suites]]
name = "public-default"
command = [ "just", "--justfile", "tooling/performance.just", "--working-directory", ".", "current-public-default", "list" ]
timeout = 14400

[[phases.current.discovery.suites]]
name = "public-exact"
command = [ "just", "--justfile", "tooling/performance.just", "--working-directory", ".", "current-public-exact", "list" ]
timeout = 14400

[[series]]
name = "la-stack baseline"
phase = "baseline"
select = { include = [ "*" ], exclude = [ "d*/nalgebra_*", "d*/faer_*" ] }

[[series]]
name = "la-stack current"
phase = "current"
select = { include = [ "*" ], exclude = [ "d*/nalgebra_*", "d*/faer_*" ] }

[[series]]
name = "nalgebra"
phase = "baseline"
[series.rows]
"d2/la_stack_lu_solve" = "d2/nalgebra_lu_solve"
"d3/la_stack_lu_solve" = "d3/nalgebra_lu_solve"
