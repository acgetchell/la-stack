schema = 1
repository = "acgetchell/la-stack"
package = "la-stack"
workflow = ".github/workflows/ci.yml"
workflow-name = "CI"
branch = "main"
artifact-prefix = "release-evidence"
guarantee = "signed-source"

[[jobs]]
name = "prepare (ubuntu-latest)"
steps = [ "Set up declared tools", "Run CI policy checks" ]
runner-labels = [ "ubuntu-latest" ]

[[jobs]]
name = "prepare (macos-latest)"
steps = [ "Set up declared tools", "Run CI policy checks" ]
runner-labels = [ "macos-latest" ]

[[jobs]]
name = "prepare (windows-latest)"
steps = [ "Set up declared tools", "Run CI policy checks" ]
runner-labels = [ "windows-latest" ]

[[jobs]]
name = "release-package"
steps = [ "Verify default and exact Cargo packages" ]

[[jobs]]
name = "native-rust (ubuntu-latest)"
steps = [ "Set up declared tools", "Run native validation" ]
runner-labels = [ "ubuntu-latest" ]

[[jobs]]
name = "native-python (ubuntu-latest)"
steps = [ "Set up declared tools", "Run native validation" ]
runner-labels = [ "ubuntu-latest" ]

[[jobs]]
name = "native-candidate (ubuntu-latest)"
steps = [ "Set up declared tools", "Run native validation" ]
runner-labels = [ "ubuntu-latest" ]

[[jobs]]
name = "native-dependencies (ubuntu-latest)"
steps = [ "Set up declared tools", "Run native validation" ]
runner-labels = [ "ubuntu-latest" ]

[[jobs]]
name = "native-rust (macos-latest)"
steps = [ "Set up declared tools", "Run native validation" ]
runner-labels = [ "macos-latest" ]

[[jobs]]
name = "native-python (macos-latest)"
steps = [ "Set up declared tools", "Run native validation" ]
runner-labels = [ "macos-latest" ]

[[jobs]]
name = "native-candidate (macos-latest)"
steps = [ "Set up declared tools", "Run native validation" ]
runner-labels = [ "macos-latest" ]

[[jobs]]
name = "native-dependencies (macos-latest)"
steps = [ "Set up declared tools", "Run native validation" ]
runner-labels = [ "macos-latest" ]

[[jobs]]
name = "native-rust (windows-latest)"
steps = [ "Set up declared tools", "Run native validation" ]
runner-labels = [ "windows-latest" ]

[[jobs]]
name = "native-python (windows-latest)"
steps = [ "Set up declared tools", "Run native validation" ]
runner-labels = [ "windows-latest" ]

[[jobs]]
name = "native-candidate (windows-latest)"
steps = [ "Set up declared tools", "Run native validation" ]
runner-labels = [ "windows-latest" ]

[[jobs]]
name = "native-dependencies (windows-latest)"
steps = [ "Set up declared tools", "Run native validation" ]
runner-labels = [ "windows-latest" ]

[signing-job]
name = "release-evidence"
steps = [ "Capture successful native validation identities", "Sign original main validation evidence", "Upload signed validation evidence" ]
