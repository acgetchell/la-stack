# Named view consumed directly by `performance publish --artifacts-only`.
schema = 2
measurement = "tooling/measurements/full.toml"
payload = "target/bench-reports/full/run.json"
manifest = "target/bench-reports/full/evidence.json"
statistic = "median"
unit = "ns"
missing = "error"
csv = "docs/assets/bench/vs_linalg_dot_median_log.csv"
rows = [
    { key = "2", label = "2", coordinate = 2 },
    { key = "3", label = "3", coordinate = 3 },
    { key = "4", label = "4", coordinate = 4 },
    { key = "5", label = "5", coordinate = 5 },
    { key = "8", label = "8", coordinate = 8 },
    { key = "16", label = "16", coordinate = 16 },
    { key = "32", label = "32", coordinate = 32 },
    { key = "64", label = "64", coordinate = 64 },
]
series = [
    { name = "la-stack current", label = "la-stack", label-version = "release", rows = { "2" = "d2/la_stack_dot", "3" = "d3/la_stack_dot", "4" = "d4/la_stack_dot", "5" = "d5/la_stack_dot", "8" = "d8/la_stack_dot", "16" = "d16/la_stack_dot", "32" = "d32/la_stack_dot", "64" = "d64/la_stack_dot" } },
    { name = "nalgebra", label = "nalgebra", label-version = "dependency.nalgebra", rows = { "2" = "d2/nalgebra_dot", "3" = "d3/nalgebra_dot", "4" = "d4/nalgebra_dot", "5" = "d5/nalgebra_dot", "8" = "d8/nalgebra_dot", "16" = "d16/nalgebra_dot", "32" = "d32/nalgebra_dot", "64" = "d64/nalgebra_dot" } },
    { name = "faer", label = "faer", label-version = "dependency.faer", rows = { "2" = "d2/faer_dot_native", "3" = "d3/faer_dot_native", "4" = "d4/faer_dot_native", "5" = "d5/faer_dot_native", "8" = "d8/faer_dot_native", "16" = "d16/faer_dot_native", "32" = "d32/faer_dot_native", "64" = "d64/faer_dot_native" } },
]
comparisons = [ { numerator = "nalgebra", denominator = "la-stack current" }, { numerator = "faer", denominator = "la-stack current" } ]

[plot]
path = "docs/assets/bench/vs_linalg_dot_median_log.svg"
title = "Vector dot product: median time vs dimension"
x-label = "Dimension D"
y-label = "Time"
x-scale = "linear"
y-scale = "log"

