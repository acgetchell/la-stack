[project]
name = "la-stack-semgrep"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [ "semgrep==1.182.0" ]

[tool.uv]
package = false
# Semgrep's sdist does not bundle its required native engine.
no-build-package = [ "semgrep" ]
# Semgrep pins vulnerable MCP 1.29.0; retain the patched 1.x API until upstream updates.
# GHSA-xcq7-p3pf-p88h requires OpenTelemetry API 1.45.1; keep its SDK,
# exporter and instrumentation on the matching release train until Semgrep updates.
override-dependencies = [
    "mcp>=1.30.0,<2",
    "opentelemetry-api>=1.45.1,<1.46",
    "opentelemetry-sdk>=1.45.1,<1.46",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1,<1.46",
    "opentelemetry-instrumentation-requests>=0.66b1,<0.67",
    "opentelemetry-instrumentation-threading>=0.66b1,<0.67",
]
