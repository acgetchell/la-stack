[metrics.det_via_lu]
title = "Determinant via LU (factor + det)"
benchmarks = [ "la_stack_det_via_lu", "nalgebra_det_via_lu", "faer_det_via_lu" ]

[metrics.lu]
title = "LU factorization"
benchmarks = [ "la_stack_lu", "nalgebra_lu", "faer_lu" ]

[metrics.lu_solve]
title = "LU solve (factor + solve)"
benchmarks = [ "la_stack_lu_solve", "nalgebra_lu_solve", "faer_lu_solve" ]

[metrics.solve_from_lu]
title = "Solve from precomputed LU"
benchmarks = [ "la_stack_solve_from_lu", "nalgebra_solve_from_lu", "faer_solve_from_lu" ]

[metrics.det_from_lu]
title = "Determinant from precomputed LU"
benchmarks = [ "la_stack_det_from_lu", "nalgebra_det_from_lu", "faer_det_from_lu" ]

[metrics.dot]
title = "Vector dot product"
benchmarks = [ "la_stack_dot", "nalgebra_dot", "faer_dot_native" ]

[metrics.norm2_sq]
title = "Vector squared 2-norm"
benchmarks = [ "la_stack_norm2_sq", "nalgebra_norm_squared", "faer_norm2_sq" ]

[metrics.inf_norm]
title = "Matrix infinity norm (max abs row sum)"
benchmarks = [ "la_stack_inf_norm", "nalgebra_inf_norm", "faer_inf_norm" ]
