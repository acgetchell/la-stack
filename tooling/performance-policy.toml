[peers]
la_stack_det_via_lu = [ "nalgebra_det_via_lu", "faer_det_via_lu" ]
la_stack_lu = [ "nalgebra_lu", "faer_lu" ]
la_stack_lu_solve = [ "nalgebra_lu_solve", "faer_lu_solve" ]
