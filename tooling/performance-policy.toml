rational_input_d4 = [ "det_sign_row_cleared_bareiss", "det_row_cleared_bareiss", "det_big_rational_gaussian", "solve_row_cleared_bareiss", "solve_big_rational_gaussian" ]
rational_input_d5 = [ "det_sign_row_cleared_bareiss", "det_row_cleared_bareiss", "det_big_rational_gaussian", "solve_row_cleared_bareiss", "solve_big_rational_gaussian" ]
rational_input_d6 = [ "det_sign_row_cleared_bareiss", "det_row_cleared_bareiss", "det_big_rational_gaussian", "solve_row_cleared_bareiss", "solve_big_rational_gaussian" ]
rational_input_d7 = [ "det_sign_row_cleared_bareiss", "det_row_cleared_bareiss", "det_big_rational_gaussian", "solve_row_cleared_bareiss", "solve_big_rational_gaussian" ]
