# la-stack scientific selections; generic execution and rendering are shared.
schema = 1
dimensions = [ 2, 3, 4, 5, 8, 16, 32, 64 ]
minimum-release = [ 0, 5, 0 ]
library-benchmarks = [ "la_stack_det", "la_stack_det_from_ldlt", "la_stack_det_from_lu", "la_stack_det_via_lu", "la_stack_dot", "la_stack_inf_norm", "la_stack_ldlt", "la_stack_ldlt_solve", "la_stack_lu", "la_stack_lu_solve", "la_stack_norm2_sq", "la_stack_solve_from_ldlt", "la_stack_solve_from_lu" ]

