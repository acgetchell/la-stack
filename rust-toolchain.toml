[toolchain]
# Pin to MSRV as specified in Cargo.toml
channel = "1.98.1"

# Components used by the shared development and CI toolchain.
components = [
    "clippy", # Linting (you use strict pedantic mode)
    "rustfmt", # Code formatting (you use cargo fmt --all)
    "rust-src", # Source code for IDEs and local diagnostics
    "llvm-tools-preview", # Coverage instrumentation
]

# Keep native host installs small.
profile = "minimal"
