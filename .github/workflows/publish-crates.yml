name: Publish to crates.io

on:
  release:
    types: [published]

permissions:
  contents: read

# Serialize all uploads for this crate, including reruns. Never cancel an upload.
concurrency:
  group: publish-crates-la-stack
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    if: >-
      github.repository == 'acgetchell/la-stack' &&
      github.event_name == 'release' && github.event.action == 'published' &&
      !github.event.release.draft && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
      actions: read
    outputs:
      ci-evidence: ${{ steps.evidence.outputs.identity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up declared tools without caches
        uses: ./.github/actions/setup-tools # zizmor: ignore[self-repository] actionlint 1.7.12 does not accept $/...
        with:
          cache: "false"

      - name: Require reviewed release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: just release-gate "$RELEASE_TAG"

      - name: Verify original signed main CI evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity=$(just release-evidence)
          test -n "$identity"
          printf 'identity=%s\n' "$identity" >> "$GITHUB_OUTPUT"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: crates-io
    permissions:
      contents: read
      checks: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up declared tools without caches
        uses: ./.github/actions/setup-tools # zizmor: ignore[self-repository] actionlint 1.7.12 does not accept $/...
        with:
          cache: "false"

      - name: Recheck evidence and registry absence after deployment approval
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          CI_EVIDENCE: ${{ needs.verify.outputs.ci-evidence }}
        run: |
          set -euo pipefail
          just release-gate "$RELEASE_TAG"
          test -n "$CI_EVIDENCE"
          just release-evidence "$CI_EVIDENCE"
          uv run --locked --no-sync research-repo-tools release registry "$RELEASE_TAG" --expect absent

      - name: Obtain a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # Original main CI built default/exact packages without upload credentials.
      # Repackage the same clean, revalidated commit without running build scripts.
      - name: Package and upload verified source without building
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: uv run --locked --no-sync research-repo-tools toolchain run -- cargo publish --locked --package la-stack --registry crates-io --no-verify

      - name: Check visibility even after a Cargo upload timeout
        if: ${{ !cancelled() && steps.auth.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: just release-verify "$RELEASE_TAG"
