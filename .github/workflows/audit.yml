name: "Audit dependencies"

on:
  push:
    branches: ["main"]
    paths:
      - .github/workflows/audit.yml
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - rust-toolchain.toml
      - "**/pyproject.toml"
      - "**/uv.lock"
      - .github/actions/setup-tools/action.yml
  pull_request:
    paths:
      - .github/workflows/audit.yml
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - rust-toolchain.toml
      - "**/pyproject.toml"
      - "**/uv.lock"
      - .github/actions/setup-tools/action.yml
  schedule:
    - cron: "0 6 * * 1" # Monday at 6 AM UTC
  workflow_dispatch:

concurrency:
  group: >
    audit-${{ github.workflow }}-${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.number ||
      github.ref
    }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up declared tools
        uses: ./.github/actions/setup-tools # zizmor: ignore[self-repository] actionlint 1.7.12 does not accept $/...

      - name: Audit root and independent Python locks
        run: uv run --locked --group dev research-repo-tools security osv uv.lock tooling/semgrep/uv.lock

      - name: Retain dependency audit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-audit-results
          path: target/security/osv-*

  audit:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      CARGO_AUDIT_VERSION: "0.22.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: true # toolchain/components are specified in rust-toolchain.toml
          cache-bin: false

      - name: Cache audit database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/advisory-db
          key: advisory-db-${{ github.ref_name }}-v1
          restore-keys: advisory-db-

      - name: Install cargo-audit
        uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: cargo-audit@${{ env.CARGO_AUDIT_VERSION }}

      - name: Run cargo audit
        id: audit
        run: |
          set +e
          cargo audit --format sarif > audit-results.sarif
          sarif_status=$?
          cargo audit --json > audit-results.json
          json_status=$?
          cargo audit
          text_status=$?
          set -e

          exit_code=0
          if ((sarif_status != 0 || json_status != 0 || text_status != 0)); then
            exit_code=1
          fi
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload audit SARIF results
        if: >-
          always() &&
          hashFiles('audit-results.sarif') != '' &&
          (
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
          )
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: audit-results.sarif
          category: cargo-audit
          wait-for-processing: true

      - name: Upload audit results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: audit-results
          path: |
            audit-results.json
            audit-results.sarif

      - name: Fail on audit findings
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
