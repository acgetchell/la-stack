name: Benchmarks

# Exploratory timings for a maintainer-selected ref.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CRITERION_HOME: target/criterion
  RUST_BACKTRACE: 1

jobs:
  bench:
    runs-on: ubuntu-latest
    # At Criterion's default 8 s of warm-up and measurement per case,
    # 400+ cases need more than 53 minutes before build and analysis.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up declared tools
        uses: ./.github/actions/setup-tools # zizmor: ignore[self-repository] actionlint 1.7.12 does not accept $/...

      - name: Validate benchmark inputs
        run: just test-bench-inputs

      - name: Measure the full exact suite
        run: just bench-exact --noplot

      - name: Upload exploratory timings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exploratory-exact-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/criterion/
          retention-days: 14
          if-no-files-found: error
