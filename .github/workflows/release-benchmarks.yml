name: Release Benchmarks

# Attach full Criterion baselines to a draft before publishing the release.
# Release jobs publish durable artifacts, so they intentionally do not restore
# or save dependency caches.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable vX.Y.Z tag matching the workflow ref, with a mutable draft release
        required: true
        type: string

concurrency:
  group: release-benchmarks-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-release:
    # Draft visibility requires push access. This job executes no repository code.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target: ${{ steps.target.outputs.target }}
      validated-attempt: ${{ github.run_attempt }}
    steps:
      - name: Install trusted package runner
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.1"
          enable-cache: false
          cache-python: false

      - name: Validate draft release target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "::error::Dispatch with --ref $RELEASE_TAG and the matching tag input"
            exit 1
          fi
          target="$(uvx --python 3.15 --from research-repo-tools==0.1.9 research-repo-tools \
            --root "$RUNNER_TEMP" performance release-draft "$GH_REPO" "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" --expected-title "$RELEASE_TAG" | jq -c .)"
          echo "target=$target" >> "$GITHUB_OUTPUT"

  release-baseline:
    needs: validate-release
    runs-on: ubuntu-latest
    # 2 min checkout + 28 min shared setup + 150 min comparative + 90 min exact
    # + 15 min for the tail and runner overhead.
    timeout-minutes: 285
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      CRITERION_HOME: ${{ github.workspace }}/target/criterion
    outputs:
      release-asset: ${{ steps.package-baseline.outputs.asset }}
      artifact-name: ${{ steps.package-baseline.outputs.artifact-name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use the workflow's own commit and tag cache scope, never a separate ref.
          ref: ${{ github.sha }}
          persist-credentials: false
        timeout-minutes: 2

      - name: Prepare release benchmarks
        # One parent timeout bounds all nested installs, validation, and inventory.
        timeout-minutes: 28
        uses: ./.github/actions/prepare-release-benchmarks # zizmor: ignore[self-repository] actionlint 1.7.12 does not accept $/...
        with:
          validated-attempt: ${{ needs.validate-release.outputs.validated-attempt }}

      - name: Save comparative Criterion baseline
        id: comparative
        timeout-minutes: 150
        run: |
          set -euo pipefail
          echo "[release-baseline] vs_linalg started $(date -u +%FT%TZ); budget 150 min"
          date +%s > target/vs_linalg-started
          just bench-save-baseline "$RELEASE_TAG" vs_linalg
          date +%s > target/vs_linalg-finished

      - name: Save exact Criterion baseline
        id: exact
        timeout-minutes: 90
        run: |
          set -euo pipefail
          echo "[release-baseline] exact started $(date -u +%FT%TZ); budget 90 min"
          date +%s > target/exact-started
          just bench-save-baseline "$RELEASE_TAG" exact
          date +%s > target/exact-finished

      - name: Validate complete release dataset
        run: just bench-release-check "$RELEASE_TAG"

      - name: Package release Criterion baseline
        id: package-baseline
        run: |
          set -euo pipefail

          asset="la-stack-${RELEASE_TAG}-criterion-baseline.tar.gz"
          cp target/release-benchmark-inventory.json target/criterion/release-benchmark-inventory.json
          tar -C target -czf "$asset" criterion
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "artifact-name=bench-baseline-${RELEASE_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload temporary baseline artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package-baseline.outputs.artifact-name }}
          path: ${{ steps.package-baseline.outputs.asset }}
          retention-days: 30
          if-no-files-found: error

      - name: Suite timing summary
        if: ${{ always() }}
        env:
          COMPARATIVE_OUTCOME: ${{ steps.comparative.outcome }}
          EXACT_OUTCOME: ${{ steps.exact.outcome }}
        run: |
          set -euo pipefail
          {
            echo "### Release benchmark timing"
            echo ""
            echo "| Suite | Outcome | Elapsed seconds | Budget minutes |"
            echo "| --- | --- | --- | --- |"
            for suite in vs_linalg exact; do
              elapsed="not started"
              if [[ -f "target/$suite-started" ]]; then
                end="$(date +%s)"
                if [[ -f "target/$suite-finished" ]]; then
                  end="$(cat "target/$suite-finished")"
                fi
                elapsed="$((end - $(cat "target/$suite-started")))"
              fi
              outcome="$COMPARATIVE_OUTCOME"
              budget=150
              if [[ "$suite" == exact ]]; then
                outcome="$EXACT_OUTCOME"
                budget=90
              fi
              echo "| $suite | $outcome | $elapsed | $budget |"
            done
            echo ""
            echo "An unfinished suite reports elapsed time through this summary."
          } | tee -a "$GITHUB_STEP_SUMMARY"

  publish-baseline:
    needs: [validate-release, release-baseline]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install trusted package runner
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.1"
          enable-cache: false
          cache-python: false

      - name: Download release baseline
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.release-baseline.outputs.artifact-name }}

      - name: Attach baseline and publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TARGET: ${{ needs.validate-release.outputs.target }}
          RELEASE_ASSET: ${{ needs.release-baseline.outputs.release-asset }}
        run: |
          set -euo pipefail

          [[ "$RELEASE_ASSET" == "la-stack-${RELEASE_TAG}-criterion-baseline.tar.gz" ]] || exit 1
          printf '%s\n' "$RELEASE_TARGET" > "$RUNNER_TEMP/release-target.json"
          uvx --python 3.15 --from research-repo-tools==0.1.9 research-repo-tools \
            --root "$RUNNER_TEMP" performance release-upload "$GH_REPO" "$RELEASE_TAG" \
            "$GITHUB_WORKSPACE/$RELEASE_ASSET" --target "$RUNNER_TEMP/release-target.json" --publish

      - name: Release baseline summary
        env:
          RELEASE_ASSET: ${{ needs.release-baseline.outputs.release-asset }}
        run: |
          set -euo pipefail

          {
            echo "### Release Benchmark Baseline"
            echo ""
            echo "Published release with verified asset: \`$RELEASE_ASSET\`"
          } >> "$GITHUB_STEP_SUMMARY"
