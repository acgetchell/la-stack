name: Release Benchmarks

# Attach full Criterion baselines for maintainer review before publication.
# Release jobs publish durable artifacts, so they intentionally do not restore
# or save dependency caches.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable vX.Y.Z tag matching the workflow ref, with a mutable draft release
        required: true
        type: string

concurrency:
  group: release-benchmarks-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-release:
    # Draft visibility requires push access. This job executes no repository code.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target: ${{ steps.target.outputs.target }}
      validated-attempt: ${{ github.run_attempt }}
    steps:
      - name: Install trusted package runner
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.6"
          enable-cache: false
          cache-python: false

      - name: Validate draft release target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "::error::Dispatch with --ref $RELEASE_TAG and the matching tag input"
            exit 1
          fi
          target="$(uvx --python 3.15 --from research-repo-tools==0.2.4 research-repo-tools \
            --root "$RUNNER_TEMP" performance release-draft "$GH_REPO" "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" --expected-title "$RELEASE_TAG" | jq -c .)"
          echo "target=$target" >> "$GITHUB_OUTPUT"

  measure-baseline:
    needs: validate-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [public-default, public-exact]
    # Per runner: 2 min checkout + 60 min preparation + 2 min host capture
    # + 240 min measurement + 26 min packaging, upload and overhead.
    timeout-minutes: 330
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      BENCH_SUITE: ${{ matrix.suite }}
      CRITERION_HOME: ${{ github.workspace }}/target/criterion

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
        timeout-minutes: 2

      - name: Prepare release benchmarks
        timeout-minutes: 60
        uses: ./.github/actions/prepare-release-benchmarks # zizmor: ignore[self-repository] actionlint 1.7.12 does not accept $/...
        with:
          validated-attempt: ${{ needs.validate-release.outputs.validated-attempt }}

      - name: Capture runner host
        timeout-minutes: 2
        run: uv run --locked --no-sync research-repo-tools performance host --output target/release-host.json

      - name: Save Criterion suite
        id: measurement
        timeout-minutes: 240
        run: |
          set -euo pipefail
          echo "[release-baseline] $BENCH_SUITE started $(date -u +%FT%TZ); budget 240 min"
          date +%s > "target/$BENCH_SUITE-started"
          just bench-save-baseline "$RELEASE_TAG" "$BENCH_SUITE"
          date +%s > "target/$BENCH_SUITE-finished"

      - name: Package Criterion suite
        run: |
          set -euo pipefail
          output="target/release-suites/$BENCH_SUITE"
          features=bench
          if [[ "$BENCH_SUITE" == public-exact ]]; then
            features=bench,exact
          fi
          uvx --python 3.15 --from research-repo-tools==0.2.4 research-repo-tools performance pack-suite \
            tooling/criterion-saved.toml "$BENCH_SUITE" --saved-sample "$RELEASE_TAG" \
            --output "$output/criterion.tar.gz" --revision "$GITHUB_SHA" \
            --session "$GITHUB_REPOSITORY:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
            --host target/release-host.json \
            --started-at "$(cat "target/$BENCH_SUITE-started")" \
            --finished-at "$(cat "target/$BENCH_SUITE-finished")" \
            --context "command=just bench-save-baseline $RELEASE_TAG $BENCH_SUITE" \
            --context "features=$features" --context "runner=$RUNNER_NAME" \
            --context "image=$ImageOS" --context "image_version=$ImageVersion" \
            --context "rustc=$(rustc -vV | paste -sd ';' -)" \
            --context "cargo=$(cargo --version)" \
            --context "cargo_lock_sha256=$(sha256sum Cargo.lock | cut -d ' ' -f 1)"
          # Transport the native inventory separately for the assembly plan.
          # Both archives must match it and the checked-in required case policy.
          if [[ "$BENCH_SUITE" == public-default ]]; then
            cp target/release-benchmark-inventory.json "$output/inventory.json"
          fi

      - name: Upload temporary suite artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-suite-${{ inputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}
          path: target/release-suites/${{ matrix.suite }}
          retention-days: 30
          if-no-files-found: error

      - name: Suite timing summary
        if: ${{ always() }}
        env:
          SUITE_OUTCOME: ${{ steps.measurement.outcome }}
        run: |
          set -euo pipefail
          elapsed="not started"
          if [[ -f "target/$BENCH_SUITE-started" ]]; then
            end="$(date +%s)"
            if [[ -f "target/$BENCH_SUITE-finished" ]]; then
              end="$(cat "target/$BENCH_SUITE-finished")"
            fi
            elapsed="$((end - $(cat "target/$BENCH_SUITE-started")))"
          fi
          {
            echo "### Release benchmark timing"
            echo ""
            echo "| Suite | Outcome | Elapsed seconds | Budget minutes |"
            echo "| --- | --- | --- | --- |"
            echo "| $BENCH_SUITE | $SUITE_OUTCOME | $elapsed | 240 |"
            echo ""
            echo "An unfinished suite reports elapsed time through this summary."
          } | tee -a "$GITHUB_STEP_SUMMARY"

  release-baseline:
    needs: [validate-release, measure-baseline]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    outputs:
      release-asset: ${{ steps.package-baseline.outputs.asset }}
      artifact-name: ${{ steps.package-baseline.outputs.artifact-name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install trusted package runner
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.6"
          enable-cache: false
          cache-python: false

      - name: Download default suite
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-suite-${{ inputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}-public-default
          path: target/release-suites/public-default

      - name: Download exact suite
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-suite-${{ inputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}-public-exact
          path: target/release-suites/public-exact

      - name: Assemble release Criterion baseline
        id: package-baseline
        run: |
          set -euo pipefail

          asset="la-stack-${RELEASE_TAG}-criterion-baseline.tar.gz"
          cp target/release-suites/public-default/inventory.json target/release-benchmark-inventory.json
          uvx --python 3.15 --from research-repo-tools==0.2.4 research-repo-tools \
            --root "$GITHUB_WORKSPACE" performance assemble-suites tooling/criterion-saved.toml \
            target/release-suites/public-default/criterion.tar.gz \
            target/release-suites/public-exact/criterion.tar.gz \
            --saved-sample "$RELEASE_TAG" --output "$asset" --revision "$GITHUB_SHA" \
            --session "$GITHUB_REPOSITORY:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "artifact-name=bench-baseline-${RELEASE_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload temporary baseline artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package-baseline.outputs.artifact-name }}
          path: ${{ steps.package-baseline.outputs.asset }}
          retention-days: 30
          if-no-files-found: error

  publish-baseline:
    needs: [validate-release, release-baseline]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install trusted package runner
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.6"
          enable-cache: false
          cache-python: false

      - name: Download release baseline
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.release-baseline.outputs.artifact-name }}

      - name: Attach baseline for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TARGET: ${{ needs.validate-release.outputs.target }}
          RELEASE_ASSET: ${{ needs.release-baseline.outputs.release-asset }}
        run: |
          set -euo pipefail

          [[ "$RELEASE_ASSET" == "la-stack-${RELEASE_TAG}-criterion-baseline.tar.gz" ]] || exit 1
          printf '%s\n' "$RELEASE_TARGET" > "$RUNNER_TEMP/release-target.json"
          uvx --python 3.15 --from research-repo-tools==0.2.4 research-repo-tools \
            --root "$RUNNER_TEMP" performance release-upload "$GH_REPO" "$RELEASE_TAG" \
            "$GITHUB_WORKSPACE/$RELEASE_ASSET" --target "$RUNNER_TEMP/release-target.json"

      - name: Release baseline summary
        env:
          RELEASE_ASSET: ${{ needs.release-baseline.outputs.release-asset }}
        run: |
          set -euo pipefail

          {
            echo "### Release Benchmark Baseline"
            echo ""
            echo "Draft release with verified asset: \`$RELEASE_ASSET\`"
            echo "Review the draft, then run \`just release-publish <tag>\` as the maintainer."
          } >> "$GITHUB_STEP_SUMMARY"
