name: Dependabot approval and auto-merge

# Trusted base-branch policy only; the reusable job never checks out or runs PR code.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target: # nosemgrep: la-stack.github-actions.no-pull-request-target
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
    branches:
      - main

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  approve-and-enable-auto-merge:
    permissions:
      contents: write
      pull-requests: write
    uses: acgetchell/research-repo-tools/.github/workflows/dependabot-approve.yml@4a8f53f684dee2abb7c5b8a4beab40ef29212b4c # v0.2.7
    with:
      repository: acgetchell/la-stack
      policy: >-
        {"cargo": {
          "files": ["Cargo.toml", "Cargo.lock", "benches/comparison/Cargo.toml"]
        }, "uv": {
          "files": ["pyproject.toml", "uv.lock"]
        }, "github_actions": {
          "files": [
            ".github/actions/setup-tools/action.yml",
            ".github/workflows/audit.yml",
            ".github/workflows/benchmarks.yml",
            ".github/workflows/codecov.yml",
            ".github/workflows/codeql.yml",
            ".github/workflows/dependabot-auto-merge.yml",
            ".github/workflows/release-benchmarks.yml",
            ".github/workflows/rust-clippy.yml",
            ".github/workflows/semgrep-sarif.yml",
            ".github/workflows/zizmor.yml"
          ]
        }}
