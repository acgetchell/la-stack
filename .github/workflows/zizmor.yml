name: zizmor

permissions: {}

concurrency:
  group: zizmor-${{ github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "42 18 * * 5"
  workflow_dispatch:

jobs:
  analyze:
    name: GitHub Actions Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up declared tools
        uses: ./.github/actions/setup-tools # zizmor: ignore[self-repository] actionlint 1.7.12 does not accept $/...

      - name: Run declared zizmor with SARIF output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scan_status=0
          uv run --locked --no-sync --no-python-downloads research-repo-tools \
            toolchain run -- zizmor --persona regular --format sarif .github > zizmor-results.sarif || scan_status=$?
          if [[ ! -s zizmor-results.sarif ]] || ! jq -e '.version == "2.1.0" and (.runs | type == "array")' zizmor-results.sarif > /dev/null; then
            rm -f zizmor-results.sarif
          fi
          exit "$scan_status"

      - name: Upload SARIF results
        if: >-
          always() && hashFiles('zizmor-results.sarif') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: zizmor-results.sarif
          category: zizmor
          wait-for-processing: true
