name: zizmor

permissions: {}

concurrency:
  group: zizmor-${{ github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "42 18 * * 5"
  workflow_dispatch:

jobs:
  analyze:
    name: GitHub Actions Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up declared tools
        uses: ./.github/actions/setup-tools # zizmor: ignore[self-repository] actionlint 1.7.12 does not accept $/...

      - name: Fail on workflow findings
        id: audit
        env:
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}
        run: just zizmor --require-online

      - name: Produce SARIF even when the finding gate fails
        id: sarif
        if: ${{ !cancelled() && steps.audit.outcome != 'skipped' }}
        env:
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}
        run: just zizmor --require-online --format sarif > "$RUNNER_TEMP/zizmor.sarif"

      - name: Upload SARIF results
        if: >-
          !cancelled() && steps.sarif.outcome == 'success' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
          github.actor != 'dependabot[bot]'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ runner.temp }}/zizmor.sarif
          category: zizmor
          wait-for-processing: true
