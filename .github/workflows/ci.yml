name: CI

permissions:
  contents: read

concurrency:
  group: >
    ci-${{ github.workflow }}-${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.number ||
      github.ref
    }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Disable Git autocrlf on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up declared tools
        uses: ./.github/actions/setup-tools # zizmor: ignore[self-repository] actionlint 1.7.12 does not accept $/...

      - name: Run CI checks
        run: just ci

  release-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up declared tools without caches
        uses: ./.github/actions/setup-tools # zizmor: ignore[self-repository] actionlint 1.7.12 does not accept $/...
        with:
          cache: "false"
      - name: Verify default and exact Cargo packages
        run: just release-package

  release-evidence:
    needs: [build, release-package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'acgetchell/la-stack'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: pyproject.toml
          python-version-file: .python-version
          enable-cache: false
      - name: Capture successful native validation identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uvx --python 3.15 --from research-repo-tools==0.2.4 python -I - <<'PY'
          import os
          import sys
          from pathlib import Path
          from research_repo_tools.cli import main
          from research_repo_tools.release_metadata import read_package_info
          root = Path.cwd()
          sys.exit(main([
              "release", "evidence", "create", "tooling/release-evidence.toml",
              "--checkout", str(root), "--commit", os.environ["GITHUB_SHA"],
              "--version", read_package_info(root).version,
              "--run-id", os.environ["GITHUB_RUN_ID"], "--attempt", os.environ["GITHUB_RUN_ATTEMPT"],
              "--output", "target/release-evidence/validation.json",
          ]))
          PY
      - name: Sign original main validation evidence
        id: validation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/release-evidence/validation.json
          create-storage-record: false
      - name: Retain the signature bundle
        env:
          VALIDATION_BUNDLE: ${{ steps.validation.outputs.bundle-path }}
        run: cp "$VALIDATION_BUNDLE" target/release-evidence/validation.sigstore.json
      - name: Upload signed validation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/release-evidence/
          if-no-files-found: error
          retention-days: 30
