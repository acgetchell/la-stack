name: Repository Rule SARIF

concurrency:
  group: >
    semgrep-sarif-${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.number ||
      github.ref
    }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "42 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep-sarif:
    name: Repository Rule SARIF Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up declared tools
        uses: ./.github/actions/setup-tools # zizmor: ignore[self-repository] actionlint 1.7.12 does not accept $/...

      - name: Run repository Semgrep rules
        id: semgrep
        run: |
          set +e
          uv run --locked semgrep \
            --metrics off \
            --error \
            --strict \
            --timeout 30 \
            --config semgrep.yaml \
            --sarif \
            --output semgrep-raw.sarif \
            .
          status=$?
          set -e
          # GitHub ignores SARIF suppression metadata; honor reviewed inline exceptions.
          jq '.runs[].results |= map(select(any(.suppressions[]?; .kind == "inSource") | not))' semgrep-raw.sarif > semgrep-results.sarif
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload SARIF results
        if: >-
          always() &&
          hashFiles('semgrep-results.sarif') != '' &&
          (
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
          )
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep-repository-rules
          wait-for-processing: true

      - name: Fail on repository rule findings
        if: steps.semgrep.outputs.exit_code != '0'
        run: exit 1
