name: Repository Rule SARIF

concurrency:
  group: >
    semgrep-sarif-${{
      github.event_name == 'pull_request' &&
      github.event.pull_request.number ||
      github.ref
    }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "42 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep-sarif:
    name: Repository Rule SARIF Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read uv version
        id: uv_version
        run: |
          version="$(grep '^uv_version :=' justfile | cut -d '"' -f 2)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ steps.uv_version.outputs.version }}

      - name: Run repository Semgrep rules
        id: semgrep
        run: |
          set +e
          uv run --locked semgrep \
            --metrics off \
            --error \
            --strict \
            --timeout 30 \
            --config semgrep.yaml \
            --sarif \
            --output semgrep-results.sarif \
            .
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload SARIF results
        if: >-
          always() &&
          hashFiles('semgrep-results.sarif') != '' &&
          (
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
          )
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep-repository-rules
          wait-for-processing: true

      - name: Fail on repository rule findings
        if: steps.semgrep.outputs.exit_code != '0'
        run: exit 1
