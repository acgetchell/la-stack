name: Set up declared tools
description: Install the locked shared package, synchronize declared tools, and export verified paths.

inputs:
  cache:
    description: Cache dependencies and managed Cargo compilation; release jobs must disable this.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install declared uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version-file: pyproject.toml
        enable-cache: ${{ inputs.cache }}
        cache-python: false

    - name: Cache managed Cargo compilation
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/rrt-cargo-build
        key: >-
          cargo-build-v1-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('rust-toolchain.toml', 'pyproject.toml', 'uv.lock', 'Cargo.lock', '.python-version')
          }}

    - name: Set up declared tools and development environment
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RESEARCH_REPO_TOOLS_HOME: ${{ runner.temp }}/rrt
        RESEARCH_REPO_TOOLS_CARGO_BUILD_HOME: ${{ runner.temp }}/rrt-cargo-build
      run: uv run --locked --managed-python --only-group tooling research-repo-tools setup

    - name: Export verified managed paths
      shell: bash
      env:
        RESEARCH_REPO_TOOLS_HOME: ${{ runner.temp }}/rrt
      run: uv run --locked --no-sync --no-python-downloads research-repo-tools toolchain export
